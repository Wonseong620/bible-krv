name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 공개 화면과 다운로드 파일만 준비한다
        run: |
          python3 scripts/build-share-page.py
          mkdir -p _site
          cp manifest.webmanifest install.js icon-180.png icon-192.png icon-512.png index.html share.html counsel.css counsel.js counsel-config.js share-logo-v1.png share-logo-v2.png qr.png gaeyeok-hangeul.pdf gaeyeok-hangeul.txt gaeyeok-hangeul.tsv .nojekyll _site/
      - name: 정적 파일을 올린다
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
